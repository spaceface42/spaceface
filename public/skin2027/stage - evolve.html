<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hybrid Scatter Stage</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #e9e7df;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  .stage.is-dragging {
    cursor: grabbing;
  }

  .stage-canvas {
    position: absolute;
    top: 0;
    left: 0;
    will-change: transform;
    pointer-events: none;
  }

  .item {
    position: absolute;
    width: 180px;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    pointer-events: auto;
    -webkit-user-drag: none;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .item:hover {
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    z-index: 10;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="stage-canvas">
    <!-- Replace src with your actual images -->
    <img class="item" src="images/01.jpg" alt="">
    <img class="item" src="images/02.jpg" alt="">
    <img class="item" src="images/03.jpg" alt="">
    <img class="item" src="images/04.jpg" alt="">
    <img class="item" src="images/05.jpg" alt="">
    <img class="item" src="images/06.jpg" alt="">
    <img class="item" src="images/07.jpg" alt="">
    <img class="item" src="images/08.jpg" alt="">
  </div>
</div>

<script>
class HybridScatterStage {
  constructor(stage, options = {}) {
    this.stage = stage;
    this.canvas = stage.querySelector('.stage-canvas');
    this.items = [...stage.querySelectorAll('.item')];
    
    // Size of the virtual canvas relative to viewport
    this.scaleFactor = options.scaleFactor || 2.2;

    this.bounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
    this.canvasSize = { width: 0, height: 0 };
    
    // Main drag position tracking
    this.position = { x: 0, y: 0 };
    this.target = { x: 0, y: 0 };
    this.velocity = { x: 0, y: 0 };
    this.pointer = { x: 0, y: 0 };
    this.dragging = false;

    // Subtle mouse hover parallax tracking
    this.mouseOffset = { x: 0, y: 0 };
    this.mouseTarget = { x: 0, y: 0 };

    this.rafId = null;
    this.init();
    this.bindEvents();
  }

  clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  init() {
    this.canvasSize.width = window.innerWidth * this.scaleFactor;
    this.canvasSize.height = window.innerHeight * this.scaleFactor;
    this.canvas.style.width = `${this.canvasSize.width}px`;
    this.canvas.style.height = `${this.canvasSize.height}px`;

    // Maximum scroll boundaries (canvas moves negatively to show bottom/right)
    this.bounds.minX = window.innerWidth - this.canvasSize.width;
    this.bounds.minY = window.innerHeight - this.canvasSize.height;

    // Start in the center of the oversized canvas
    this.target.x = this.position.x = this.bounds.minX / 2;
    this.target.y = this.position.y = this.bounds.minY / 2;

    const itemWidth = 180;
    const itemHeight = 225;
    const padding = 60;

    // Distribute images randomly across the oversized bounds
    this.items.forEach(item => {
      const x = padding + Math.random() * (this.canvasSize.width - itemWidth - padding * 2);
      const y = padding + Math.random() * (this.canvasSize.height - itemHeight - padding * 2);
      const rotation = (Math.random() - 0.5) * 16;
      
      item.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rotation}deg)`;
    });

    this.render();
  }

  bindEvents() {
    this.stage.addEventListener('pointerdown', (e) => {
      this.dragging = true;
      this.stage.classList.add('is-dragging');
      this.stage.setPointerCapture(e.pointerId);

      this.pointer.x = e.clientX;
      this.pointer.y = e.clientY;
      
      // Stop inertia on grab
      this.velocity.x = 0;
      this.velocity.y = 0;

      this.startLoop();
    });

    this.stage.addEventListener('pointermove', (e) => {
      // 1. Calculate micro-parallax (only on mouse, touch ignores this)
      if (e.pointerType === 'mouse') {
        // Map cursor position to a -30px to +30px offset range
        this.mouseTarget.x = ((e.clientX / window.innerWidth) - 0.5) * 60;
        this.mouseTarget.y = ((e.clientY / window.innerHeight) - 0.5) * 60;
      }

      // 2. Calculate drag displacement
      if (this.dragging) {
        const dx = e.clientX - this.pointer.x;
        const dy = e.clientY - this.pointer.y;

        this.pointer.x = e.clientX;
        this.pointer.y = e.clientY;

        // Apply movement while strictly enforcing boundaries
        this.target.x = this.clamp(this.target.x + dx, this.bounds.minX, 0);
        this.target.y = this.clamp(this.target.y + dy, this.bounds.minY, 0);

        this.velocity.x = dx;
        this.velocity.y = dy;
      }

      this.startLoop();
    });

    const stopDrag = (e) => {
      if (!this.dragging) return;
      this.dragging = false;
      this.stage.classList.remove('is-dragging');
      
      if (e.pointerId && this.stage.hasPointerCapture(e.pointerId)) {
        this.stage.releasePointerCapture(e.pointerId);
      }
      
      // Optional: reset mouse parallax offset gently on release/leave
      if (e.type === 'pointerleave') {
        this.mouseTarget.x = 0;
        this.mouseTarget.y = 0;
      }
    };

    this.stage.addEventListener('pointerup', stopDrag);
    this.stage.addEventListener('pointercancel', stopDrag);
    this.stage.addEventListener('pointerleave', stopDrag);

    // Trackpad and scroll wheel navigation
    this.stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.target.x = this.clamp(this.target.x - e.deltaX, this.bounds.minX, 0);
      this.target.y = this.clamp(this.target.y - e.deltaY, this.bounds.minY, 0);
      this.startLoop();
    }, { passive: false });

    // Handle window resize dynamically
    window.addEventListener('resize', () => {
      this.bounds.minX = window.innerWidth - this.canvasSize.width;
      this.bounds.minY = window.innerHeight - this.canvasSize.height;
      this.target.x = this.clamp(this.target.x, this.bounds.minX, 0);
      this.target.y = this.clamp(this.target.y, this.bounds.minY, 0);
      this.startLoop();
    });
  }

  startLoop() {
    if (!this.rafId) {
      this.rafId = requestAnimationFrame(() => this.animate());
    }
  }

  animate() {
    // Apply inertia if not currently dragging
    if (!this.dragging) {
      this.target.x = this.clamp(this.target.x + this.velocity.x, this.bounds.minX, 0);
      this.target.y = this.clamp(this.target.y + this.velocity.y, this.bounds.minY, 0);
      this.velocity.x *= 0.92; // Friction multiplier
      this.velocity.y *= 0.92;
    }

    // Independent interpolation (lerping) for ultra-smooth rendering
    this.position.x += (this.target.x - this.position.x) * 0.12;
    this.position.y += (this.target.y - this.position.y) * 0.12;

    this.mouseOffset.x += (this.mouseTarget.x - this.mouseOffset.x) * 0.05;
    this.mouseOffset.y += (this.mouseTarget.y - this.mouseOffset.y) * 0.05;

    this.render();

    // Check if any value is still changing significantly to keep loop alive
    const isMoving = 
      Math.abs(this.velocity.x) > 0.01 || 
      Math.abs(this.velocity.y) > 0.01 || 
      Math.abs(this.target.x - this.position.x) > 0.05 || 
      Math.abs(this.target.y - this.position.y) > 0.05 ||
      Math.abs(this.mouseTarget.x - this.mouseOffset.x) > 0.05 ||
      Math.abs(this.mouseTarget.y - this.mouseOffset.y) > 0.05;

    if (this.dragging || isMoving) {
      this.rafId = requestAnimationFrame(() => this.animate());
    } else {
      this.rafId = null;
    }
  }

  render() {
    // Combine base canvas position with the micro-parallax offset
    const renderX = this.position.x + this.mouseOffset.x;
    const renderY = this.position.y + this.mouseOffset.y;
    
    this.canvas.style.transform = `translate3d(${renderX}px, ${renderY}px, 0)`;
  }
}

new HybridScatterStage(document.querySelector('.stage'), { scaleFactor: 2.2 });
</script>

</body>
</html>
