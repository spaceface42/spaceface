```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Draggable Scatter Stage</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #e9e7df;
}

.stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    cursor: grab;

    touch-action: none;
}

.stage.is-dragging {
    cursor: grabbing;
}

.item {
    position: absolute;

    width: 180px;
    aspect-ratio: 4 / 5;

    object-fit: cover;

    user-select: none;
    -webkit-user-drag: none;

    pointer-events: auto;

    will-change: transform;

    /*
     * The item position is relative to
     * the stage's internal coordinate system.
     */
    transform:
        translate3d(
            var(--x),
            var(--y),
            0
        )
        rotate(var(--rotation));
}

</style>
</head>

<body>

<div class="stage">

    <img class="item" src="images/01.jpg">
    <img class="item" src="images/02.jpg">
    <img class="item" src="images/03.jpg">
    <img class="item" src="images/04.jpg">
    <img class="item" src="images/05.jpg">
    <img class="item" src="images/06.jpg">
    <img class="item" src="images/07.jpg">
    <img class="item" src="images/08.jpg">

</div>


<script>

class ScatterStage {

    constructor(stage) {

        this.stage = stage;

        this.items = [
            ...stage.querySelectorAll('.item')
        ];

        /*
         * Position of the entire stage.
         */
        this.position = {
            x: 0,
            y: 0
        };

        /*
         * Target position.
         */
        this.target = {
            x: 0,
            y: 0
        };

        /*
         * Velocity used for inertia.
         */
        this.velocity = {
            x: 0,
            y: 0
        };

        /*
         * Pointer state.
         */
        this.pointer = {
            x: 0,
            y: 0
        };

        this.dragging = false;

        this.init();
        this.bindEvents();

        this.animate();
    }


    init() {

        this.items.forEach(item => {

            const x =
                Math.random() *
                (window.innerWidth - item.offsetWidth);

            const y =
                Math.random() *
                (window.innerHeight - item.offsetHeight);

            const rotation =
                (Math.random() - 0.5) * 20;


            item.dataset.x = x;
            item.dataset.y = y;
            item.dataset.rotation = rotation;

            item.style.setProperty(
                '--x',
                `${x}px`
            );

            item.style.setProperty(
                '--y',
                `${y}px`
            );

            item.style.setProperty(
                '--rotation',
                `${rotation}deg`
            );
        });
    }


    bindEvents() {

        /*
         * IMPORTANT:
         *
         * The pointer events are attached to
         * the stage itself, not to the images.
         *
         * Therefore the user can grab ANYWHERE.
         */

        this.stage.addEventListener(
            'pointerdown',
            event => {

                this.dragging = true;

                this.stage.classList.add(
                    'is-dragging'
                );

                this.stage.setPointerCapture(
                    event.pointerId
                );

                this.pointer.x =
                    event.clientX;

                this.pointer.y =
                    event.clientY;

                /*
                 * Stop inertia when grabbing again.
                 */
                this.velocity.x = 0;
                this.velocity.y = 0;
            }
        );


        this.stage.addEventListener(
            'pointermove',
            event => {

                if (!this.dragging)
                    return;


                const dx =
                    event.clientX -
                    this.pointer.x;

                const dy =
                    event.clientY -
                    this.pointer.y;


                this.pointer.x =
                    event.clientX;

                this.pointer.y =
                    event.clientY;


                /*
                 * Move the entire stage.
                 */
                this.target.x += dx;
                this.target.y += dy;


                /*
                 * Store velocity for inertia.
                 */
                this.velocity.x = dx;
                this.velocity.y = dy;
            }
        );


        this.stage.addEventListener(
            'pointerup',
            event => {

                this.dragging = false;

                this.stage.classList.remove(
                    'is-dragging'
                );

                this.stage.releasePointerCapture(
                    event.pointerId
                );
            }
        );


        this.stage.addEventListener(
            'pointercancel',
            () => {

                this.dragging = false;

                this.stage.classList.remove(
                    'is-dragging'
                );
            }
        );


        /*
         * Prevent native image dragging.
         */
        this.items.forEach(item => {

            item.addEventListener(
                'dragstart',
                event => {
                    event.preventDefault();
                }
            );

        });


        /*
         * Optional mouse-wheel navigation.
         *
         * This makes the stage feel more like
         * a large spatial canvas.
         */
        this.stage.addEventListener(
            'wheel',
            event => {

                event.preventDefault();

                this.target.x -=
                    event.deltaX;

                this.target.y -=
                    event.deltaY;

            },
            {
                passive: false
            }
        );


        window.addEventListener(
            'resize',
            () => this.resize()
        );
    }


    resize() {

        /*
         * We don't reposition the stage here.
         *
         * The composition remains where the
         * user left it.
         */
    }


    animate() {

        /*
         * Add inertia after release.
         */
        if (!this.dragging) {

            this.target.x +=
                this.velocity.x;

            this.target.y +=
                this.velocity.y;


            this.velocity.x *= 0.92;
            this.velocity.y *= 0.92;
        }


        /*
         * Smooth interpolation.
         */
        this.position.x +=
            (
                this.target.x -
                this.position.x
            ) * 0.12;


        this.position.y +=
            (
                this.target.y -
                this.position.y
            ) * 0.12;


        /*
         * Move every item by the same
         * stage offset.
         */
        this.items.forEach(item => {

            const x =
                parseFloat(item.dataset.x);

            const y =
                parseFloat(item.dataset.y);

            const rotation =
                parseFloat(
                    item.dataset.rotation
                );


            item.style.transform = `
                translate3d(
                    ${x + this.position.x}px,
                    ${y + this.position.y}px,
                    0
                )
                rotate(${rotation}deg)
            `;
        });


        requestAnimationFrame(
            () => this.animate()
        );
    }
}


new ScatterStage(
    document.querySelector('.stage')
);

</script>

</body>
</html>
