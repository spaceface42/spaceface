<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounded Draggable Scatter Stage</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #e9e7df;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  .stage.is-dragging {
    cursor: grabbing;
  }

  .stage-canvas {
    position: absolute;
    top: 0;
    left: 0;
    will-change: transform;
    pointer-events: none;
  }

  .item {
    position: absolute;
    width: 180px;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    pointer-events: auto;
    -webkit-user-drag: none;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="stage-canvas">
    <img class="item" src="images/01.jpg" alt="">
    <img class="item" src="images/02.jpg" alt="">
    <img class="item" src="images/03.jpg" alt="">
    <img class="item" src="images/04.jpg" alt="">
    <img class="item" src="images/05.jpg" alt="">
    <img class="item" src="images/06.jpg" alt="">
    <img class="item" src="images/07.jpg" alt="">
    <img class="item" src="images/08.jpg" alt="">
        <img class="item" src="images/01.jpg" alt="">
    <img class="item" src="images/02.jpg" alt="">
    <img class="item" src="images/03.jpg" alt="">
    <img class="item" src="images/04.jpg" alt="">
    <img class="item" src="images/05.jpg" alt="">
    <img class="item" src="images/06.jpg" alt="">
    <img class="item" src="images/07.jpg" alt="">
    <img class="item" src="images/08.jpg" alt="">
        <img class="item" src="images/01.jpg" alt="">
    <img class="item" src="images/02.jpg" alt="">
    <img class="item" src="images/03.jpg" alt="">
    <img class="item" src="images/04.jpg" alt="">
    <img class="item" src="images/05.jpg" alt="">
    <img class="item" src="images/06.jpg" alt="">
    <img class="item" src="images/07.jpg" alt="">
    <img class="item" src="images/08.jpg" alt="">
  </div>
</div>

<script>
class BoundedScatterStage {
  constructor(stage, options = {}) {
    this.stage = stage;
    this.canvas = stage.querySelector('.stage-canvas');
    this.items = [...stage.querySelectorAll('.item')];

    // Canvas size multiplier relative to viewport (e.g., 2.5x larger)
    this.scaleFactor = options.scaleFactor || 2.5;

    this.bounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
    this.canvasSize = { width: 0, height: 0 };

    this.position = { x: 0, y: 0 };
    this.target = { x: 0, y: 0 };
    this.velocity = { x: 0, y: 0 };
    this.pointer = { x: 0, y: 0 };
    this.dragging = false;
    this.rafId = null;

    this.init();
    this.bindEvents();
  }

  clamp(val, min, max) {
    return Math.max(min, Math.min(max, val));
  }

  init() {
    this.canvasSize.width = window.innerWidth * this.scaleFactor;
    this.canvasSize.height = window.innerHeight * this.scaleFactor;

    this.canvas.style.width = `${this.canvasSize.width}px`;
    this.canvas.style.height = `${this.canvasSize.height}px`;

    // Maximum negative scroll limits
    this.bounds.minX = window.innerWidth - this.canvasSize.width;
    this.bounds.maxX = 0;
    this.bounds.minY = window.innerHeight - this.canvasSize.height;
    this.bounds.maxY = 0;

    // Center the initial view
    const initialX = (window.innerWidth - this.canvasSize.width) / 2;
    const initialY = (window.innerHeight - this.canvasSize.height) / 2;
    this.target.x = this.position.x = initialX;
    this.target.y = this.position.y = initialY;

    const itemWidth = 180;
    const itemHeight = 225;
    const padding = 60; // Keep items away from the extreme canvas edges

    this.items.forEach(item => {
      const x = padding + Math.random() * (this.canvasSize.width - itemWidth - padding * 2);
      const y = padding + Math.random() * (this.canvasSize.height - itemHeight - padding * 2);
      const rotation = (Math.random() - 0.5) * 20;

      item.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rotation}deg)`;
    });

    this.canvas.style.transform = `translate3d(${this.position.x}px, ${this.position.y}px, 0)`;
  }

  bindEvents() {
    this.stage.addEventListener('pointerdown', (e) => {
      this.dragging = true;
      this.stage.classList.add('is-dragging');
      this.stage.setPointerCapture(e.pointerId);

      this.pointer.x = e.clientX;
      this.pointer.y = e.clientY;
      this.velocity.x = 0;
      this.velocity.y = 0;

      this.startLoop();
    });

    this.stage.addEventListener('pointermove', (e) => {
      if (!this.dragging) return;

      const dx = e.clientX - this.pointer.x;
      const dy = e.clientY - this.pointer.y;

      this.pointer.x = e.clientX;
      this.pointer.y = e.clientY;

      this.target.x = this.clamp(this.target.x + dx, this.bounds.minX, this.bounds.maxX);
      this.target.y = this.clamp(this.target.y + dy, this.bounds.minY, this.bounds.maxY);

      this.velocity.x = dx;
      this.velocity.y = dy;
    });

    const stopDragging = (e) => {
      if (!this.dragging) return;
      this.dragging = false;
      this.stage.classList.remove('is-dragging');
      if (e.pointerId && this.stage.hasPointerCapture(e.pointerId)) {
        this.stage.releasePointerCapture(e.pointerId);
      }
    };

    this.stage.addEventListener('pointerup', stopDragging);
    this.stage.addEventListener('pointercancel', stopDragging);

    this.stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.target.x = this.clamp(this.target.x - e.deltaX, this.bounds.minX, this.bounds.maxX);
      this.target.y = this.clamp(this.target.y - e.deltaY, this.bounds.minY, this.bounds.maxY);
      this.startLoop();
    }, { passive: false });

    window.addEventListener('resize', () => {
      this.bounds.minX = window.innerWidth - this.canvasSize.width;
      this.bounds.minY = window.innerHeight - this.canvasSize.height;
      this.target.x = this.clamp(this.target.x, this.bounds.minX, this.bounds.maxX);
      this.target.y = this.clamp(this.target.y, this.bounds.minY, this.bounds.maxY);
      this.startLoop();
    });
  }

  startLoop() {
    if (!this.rafId) {
      this.rafId = requestAnimationFrame(() => this.animate());
    }
  }

  animate() {
    if (!this.dragging) {
      this.target.x = this.clamp(this.target.x + this.velocity.x, this.bounds.minX, this.bounds.maxX);
      this.target.y = this.clamp(this.target.y + this.velocity.y, this.bounds.minY, this.bounds.maxY);

      this.velocity.x *= 0.92;
      this.velocity.y *= 0.92;
    }

    this.position.x += (this.target.x - this.position.x) * 0.12;
    this.position.y += (this.target.y - this.position.y) * 0.12;

    this.canvas.style.transform = `translate3d(${this.position.x}px, ${this.position.y}px, 0)`;

    const isMoving = Math.abs(this.velocity.x) > 0.01 || 
                     Math.abs(this.velocity.y) > 0.01 || 
                     Math.abs(this.target.x - this.position.x) > 0.05 || 
                     Math.abs(this.target.y - this.position.y) > 0.05;

    if (this.dragging || isMoving) {
      this.rafId = requestAnimationFrame(() => this.animate());
    } else {
      this.rafId = null;
    }
  }
}

new BoundedScatterStage(document.querySelector('.stage'), { scaleFactor: 2.2 });
</script>
</body>
</html>
