<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Accessible Scatter Stage</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #e9e7df;
    font-family: system-ui, -apple-system, sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  .stage.is-dragging {
    cursor: grabbing;
  }

  /* Background is inert while the lightbox is open */
  .stage[aria-hidden="true"] {
    pointer-events: none;
  }

  .stage-canvas {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    will-change: transform;
    pointer-events: none;
  }

  .item {
    position: absolute;
    width: 180px;
    height: 225px; /* Explicit height prevents 0px collapsed layout */
    object-fit: cover;
    pointer-events: auto;
    -webkit-user-drag: none;
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    cursor: pointer;
    outline: none;
    background-color: #d1cfc7; /* Placeholder background while loading */
    transition: box-shadow 0.2s ease, outline 0.2s ease;
  }

  .item:hover {
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
    z-index: 10;
  }

  .item:focus-visible {
    outline: 3px solid #2563eb;
    outline-offset: 4px;
    z-index: 20;
  }

  .item.is-hidden {
    opacity: 0 !important;
    pointer-events: none;
  }

  /* Visually-hidden but screen-reader-visible helper text */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* FLIP Lightbox Styles */
  .lightbox-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(18, 18, 18, 0.85);
    backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 100;
  }

  .lightbox-backdrop.is-active {
    opacity: 1;
    pointer-events: auto;
    cursor: zoom-out;
  }

  .lightbox-clone {
    position: fixed;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    z-index: 101;
    pointer-events: auto;
    cursor: zoom-out;
    transform-origin: top left; /* Critical for precise FLIP alignment */
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-radius 0.4s ease;
  }

  .lightbox-clone:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .lightbox-clone {
      transition: none;
    }
    .lightbox-backdrop {
      transition: none;
    }
  }
</style>
</head>
<body>

<main class="stage" tabindex="-1" aria-label="Interactive image scatter canvas">
  <p class="sr-only" id="stage-instructions">
    Use arrow keys to pan, plus and minus to zoom, and Tab to move between images. Press Enter or Space on an image to open it full size; press Escape to close it.
  </p>
  <div class="stage-canvas">
    <img class="item" src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500&auto=format&fit=crop&q=80" alt="Art 1" tabindex="0">
    <img class="item" src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500&auto=format&fit=crop&q=80" alt="Art 2" tabindex="0">
    <img class="item" src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=500&auto=format&fit=crop&q=80" alt="Art 3" tabindex="0">
    <img class="item" src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=500&auto=format&fit=crop&q=80" alt="Art 4" tabindex="0">
    <img class="item" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&auto=format&fit=crop&q=80" alt="Art 5" tabindex="0">
    <img class="item" src="https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=500&auto=format&fit=crop&q=80" alt="Art 6" tabindex="0">
    <img class="item" src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?w=500&auto=format&fit=crop&q=80" alt="Art 7" tabindex="0">
    <img class="item" src="https://images.unsplash.com/photo-1500462918059-b1a0cb512f1d?w=500&auto=format&fit=crop&q=80" alt="Art 8" tabindex="0">
    <img class="item" src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=500&auto=format&fit=crop&q=80" alt="Art 9" tabindex="0">
    <img class="item" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500&auto=format&fit=crop&q=80" alt="Art 10" tabindex="0">
    <img class="item" src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=500&auto=format&fit=crop&q=80" alt="Art 11" tabindex="0">
    <img class="item" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500&auto=format&fit=crop&q=80" alt="Art 12" tabindex="0">
  </div>
</main>

<div class="lightbox-backdrop" aria-hidden="true"></div>

<script>
class AccessibleScatterStage {
  constructor(stage, options = {}) {
    this.stage = stage;
    this.canvas = stage.querySelector('.stage-canvas');
    this.items = [...stage.querySelectorAll('.item')];
    this.backdrop = document.querySelector('.lightbox-backdrop');

    // How much larger the scrollable world is than the viewport.
    this.worldSizeMultiplier = options.worldSizeMultiplier || 2.4;
    this.minZoom = options.minZoom || 0.6;
    this.maxZoom = options.maxZoom || 1.8;

    // Subtle mouse-parallax drift, layered on top of pan/zoom. Purely a
    // hover flourish for mouse pointers — never affects touch, dragging,
    // the lightbox, or reduced-motion users.
    this.parallaxStrength = options.parallaxStrength || 18;
    this.parallax = { x: 0, y: 0 };
    this.parallaxTarget = { x: 0, y: 0 };

    this.prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    this.canvasSize = { width: 0, height: 0 };
    this.bounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };

    this.position = { x: 0, y: 0 };
    this.target = { x: 0, y: 0 };
    this.velocity = { x: 0, y: 0 };

    // scale = what's currently rendered; targetScale = where we're easing toward.
    this.scale = 1;
    this.targetScale = 1;

    this.activePointers = new Map();
    this.lastPointer = { x: 0, y: 0 };
    this.pinchStartDist = 0;
    this.pinchStartScale = 1;
    this.isDragging = false;
    this.hasMovedSignificantly = false;
    this.pointerDownPos = { x: 0, y: 0 };
    this.pointerType = 'mouse';

    this.activeLightbox = null;
    this.rafId = null;

    this.init();
    this.bindEvents();
  }

  clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  async preloadImages() {
    const promises = this.items.map(img => {
      if (img.complete && img.naturalWidth !== 0) return Promise.resolve();
      return new Promise((resolve) => {
        img.addEventListener('load', () => resolve(), { once: true });
        img.addEventListener('error', () => resolve(), { once: true });
      });
    });
    return Promise.all(promises);
  }

  async init() {
    await this.preloadImages();

    this.canvasSize.width = window.innerWidth * this.worldSizeMultiplier;
    this.canvasSize.height = window.innerHeight * this.worldSizeMultiplier;
    this.canvas.style.width = `${this.canvasSize.width}px`;
    this.canvas.style.height = `${this.canvasSize.height}px`;

    this.updateBounds();

    this.target.x = this.position.x = this.bounds.minX / 2;
    this.target.y = this.position.y = this.bounds.minY / 2;

    this.scatterItemsWithCollisionAvoidance();
    this.render();
  }

  scatterItemsWithCollisionAvoidance() {
    const padding = 80;
    const placedBoxes = [];

    this.items.forEach(item => {
      const width = item.offsetWidth || 180;
      const height = item.offsetHeight || 225;

      let x, y, overlaps, attempts = 0;
      const maxAttempts = 75;

      do {
        overlaps = false;
        x = padding + Math.random() * (this.canvasSize.width - width - padding * 2);
        y = padding + Math.random() * (this.canvasSize.height - height - padding * 2);

        for (const box of placedBoxes) {
          const dx = (x + width / 2) - (box.x + box.width / 2);
          const dy = (y + height / 2) - (box.y + box.height / 2);
          const minDistance = Math.max(width, height) * 0.75;

          if (Math.hypot(dx, dy) < minDistance) {
            overlaps = true;
            break;
          }
        }
        attempts++;
      } while (overlaps && attempts < maxAttempts);

      const rot = (Math.random() - 0.5) * 16;
      placedBoxes.push({ x, y, width, height });

      item.dataset.baseX = x;
      item.dataset.baseY = y;
      item.dataset.width = width;
      item.dataset.height = height;
      item.dataset.rotation = rot;

      item.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rot}deg)`;
    });
  }

  // Bounds are computed against targetScale, since that's what pan clamping
  // should track toward — not the (possibly mid-ease) rendered scale.
  updateBounds() {
    this.bounds.minX = window.innerWidth - this.canvasSize.width * this.targetScale;
    this.bounds.minY = window.innerHeight - this.canvasSize.height * this.targetScale;
    this.bounds.maxX = 0;
    this.bounds.maxY = 0;
  }

  bindEvents() {
    this.stage.addEventListener('pointerdown', (e) => {
      if (this.activeLightbox) return;

      this.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      this.pointerType = e.pointerType;

      if (this.activePointers.size === 1) {
        this.isDragging = true;
        this.hasMovedSignificantly = false;
        this.pointerDownPos = { x: e.clientX, y: e.clientY };
        this.lastPointer = { x: e.clientX, y: e.clientY };
        this.velocity = { x: 0, y: 0 };
        this.stage.classList.add('is-dragging');
        this.stage.setPointerCapture(e.pointerId);
      } else if (this.activePointers.size === 2) {
        const [p1, p2] = [...this.activePointers.values()];
        this.pinchStartDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        this.pinchStartScale = this.targetScale;
      }
      this.startLoop();
    });

    this.stage.addEventListener('pointermove', (e) => {
      if (this.activeLightbox || !this.activePointers.has(e.pointerId)) return;

      this.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (this.activePointers.size === 2) {
        const [p1, p2] = [...this.activePointers.values()];
        const currentDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const factor = currentDist / this.pinchStartDist;
        this.applyZoom(this.pinchStartScale * factor, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
        return;
      }

      if (!this.isDragging) return;

      const dx = e.clientX - this.lastPointer.x;
      const dy = e.clientY - this.lastPointer.y;

      if (!this.hasMovedSignificantly) {
        const totalDist = Math.hypot(e.clientX - this.pointerDownPos.x, e.clientY - this.pointerDownPos.y);
        if (totalDist > 8) this.hasMovedSignificantly = true;
      }

      this.lastPointer = { x: e.clientX, y: e.clientY };
      this.target.x = this.clamp(this.target.x + dx, this.bounds.minX, 0);
      this.target.y = this.clamp(this.target.y + dy, this.bounds.minY, 0);

      this.velocity = { x: dx, y: dy };
    });

    const stopDrag = (e) => {
      this.activePointers.delete(e.pointerId);
      if (this.stage.hasPointerCapture(e.pointerId)) {
        this.stage.releasePointerCapture(e.pointerId);
      }

      if (this.activePointers.size === 0) {
        this.isDragging = false;
        this.stage.classList.remove('is-dragging');
      } else if (this.activePointers.size === 1) {
        const [remaining] = [...this.activePointers.values()];
        this.lastPointer = { x: remaining.x, y: remaining.y };
      }
    };

    this.stage.addEventListener('pointerup', stopDrag);
    this.stage.addEventListener('pointercancel', stopDrag);

    this.stage.addEventListener('mousemove', (e) => {
      if (this.activeLightbox || this.isDragging || this.prefersReducedMotion) return;

      // Normalize cursor position to -1..1 from viewport center, then
      // move the world slightly *opposite* the cursor for a gentle
      // depth feel — small enough to read as ambience, not navigation.
      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;
      this.parallaxTarget.x = -nx * this.parallaxStrength;
      this.parallaxTarget.y = -ny * this.parallaxStrength;
      this.startLoop();
    });

    this.stage.addEventListener('mouseleave', () => {
      this.parallaxTarget.x = 0;
      this.parallaxTarget.y = 0;
      this.startLoop();
    });

    this.stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (this.activeLightbox) return;

      if (e.ctrlKey || e.metaKey) {
        const zoomDelta = -e.deltaY * 0.005;
        this.applyZoom(this.targetScale + zoomDelta, e.clientX, e.clientY);
      } else {
        this.target.x = this.clamp(this.target.x - e.deltaX, this.bounds.minX, 0);
        this.target.y = this.clamp(this.target.y - e.deltaY, this.bounds.minY, 0);
      }
      this.startLoop();
    }, { passive: false });

    this.items.forEach(item => {
      item.addEventListener('click', () => {
        if (this.hasMovedSignificantly) return;
        this.openLightbox(item);
      });

      item.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          this.openLightbox(item);
        }
      });

      item.addEventListener('focus', () => {
        if (this.activeLightbox) return;
        this.panToItem(item);
      });
    });

    this.backdrop.addEventListener('click', () => this.closeLightbox());

    window.addEventListener('keydown', (e) => {
      if (this.activeLightbox) {
        if (e.key === 'Escape') this.closeLightbox();
        return;
      }

      const panStep = 80;
      let handled = false;

      // A fresh keyboard pan shouldn't inherit leftover momentum from a
      // previous touch/mouse drag, or the two can visibly fight each other.
      switch (e.key) {
        case 'ArrowUp':
          this.velocity = { x: 0, y: 0 };
          this.target.y = this.clamp(this.target.y + panStep, this.bounds.minY, 0);
          handled = true;
          break;
        case 'ArrowDown':
          this.velocity = { x: 0, y: 0 };
          this.target.y = this.clamp(this.target.y - panStep, this.bounds.minY, 0);
          handled = true;
          break;
        case 'ArrowLeft':
          this.velocity = { x: 0, y: 0 };
          this.target.x = this.clamp(this.target.x + panStep, this.bounds.minX, 0);
          handled = true;
          break;
        case 'ArrowRight':
          this.velocity = { x: 0, y: 0 };
          this.target.x = this.clamp(this.target.x - panStep, this.bounds.minX, 0);
          handled = true;
          break;
        case '+':
        case '=':
          this.applyZoom(this.targetScale + 0.15, window.innerWidth / 2, window.innerHeight / 2);
          handled = true;
          break;
        case '-':
        case '_':
          this.applyZoom(this.targetScale - 0.15, window.innerWidth / 2, window.innerHeight / 2);
          handled = true;
          break;
      }

      if (handled) {
        e.preventDefault();
        this.startLoop();
      }
    });

    window.addEventListener('resize', () => {
      this.updateBounds();
      this.target.x = this.clamp(this.target.x, this.bounds.minX, 0);
      this.target.y = this.clamp(this.target.y, this.bounds.minY, 0);
      this.startLoop();
    });
  }

  panToItem(item) {
    const baseX = parseFloat(item.dataset.baseX);
    const baseY = parseFloat(item.dataset.baseY);
    const width = parseFloat(item.dataset.width);
    const height = parseFloat(item.dataset.height);

    const itemCenterX = (baseX + width / 2) * this.targetScale;
    const itemCenterY = (baseY + height / 2) * this.targetScale;

    this.target.x = this.clamp(window.innerWidth / 2 - itemCenterX, this.bounds.minX, 0);
    this.target.y = this.clamp(window.innerHeight / 2 - itemCenterY, this.bounds.minY, 0);

    this.startLoop();
  }

  // Zoom now eases via targetScale -> scale in animate(), instead of
  // snapping this.scale instantly (which used to cause a visible
  // pop-then-slide when position was still lerping toward its target).
  applyZoom(nextScale, originX, originY) {
    const clampedScale = this.clamp(nextScale, this.minZoom, this.maxZoom);
    const prevScale = this.targetScale;
    if (clampedScale === prevScale) return;

    this.targetScale = clampedScale;
    this.updateBounds();

    const scaleRatio = clampedScale / prevScale;
    this.target.x = this.clamp(originX - (originX - this.target.x) * scaleRatio, this.bounds.minX, 0);
    this.target.y = this.clamp(originY - (originY - this.target.y) * scaleRatio, this.bounds.minY, 0);

    if (this.prefersReducedMotion) {
      this.scale = clampedScale; // snap instead of easing
    }

    this.startLoop();
  }

  openLightbox(item) {
    if (this.activeLightbox) return;

    // Trap: take the background out of the tab order and hide it from AT
    // while the lightbox is open, so Tab/screen-reader users can't wander
    // into scattered images sitting behind the modal.
    this.items.forEach(i => i.setAttribute('tabindex', '-1'));
    this.stage.setAttribute('aria-hidden', 'true');

    const firstRect = item.getBoundingClientRect();
    const clone = item.cloneNode();
    clone.className = 'lightbox-clone';
    clone.setAttribute('tabindex', '0');
    clone.setAttribute('role', 'dialog');
    clone.setAttribute('aria-modal', 'true');
    clone.setAttribute('aria-label', item.alt || 'Enlarged image');

    const initialRot = item.dataset.rotation || '0';

    // Explicit initial pixel coordinates matching rect
    clone.style.top = `${firstRect.top}px`;
    clone.style.left = `${firstRect.left}px`;
    clone.style.width = `${firstRect.width}px`;
    clone.style.height = `${firstRect.height}px`;
    clone.style.transform = `rotate(${initialRot}deg)`;

    document.body.appendChild(clone);
    item.classList.add('is-hidden');
    this.backdrop.classList.add('is-active');
    this.backdrop.setAttribute('aria-hidden', 'false');

    this.activeLightbox = { original: item, clone, rot: initialRot };

    // Force browser reflow to register starting point
    clone.getBoundingClientRect();

    // Calculate center destination
    const targetHeight = Math.min(window.innerHeight * 0.8, 620);
    const targetWidth = targetHeight * (4 / 5);
    const centerX = (window.innerWidth - targetWidth) / 2;
    const centerY = (window.innerHeight - targetHeight) / 2;

    const deltaX = centerX - firstRect.left;
    const deltaY = centerY - firstRect.top;
    const scaleFactor = targetWidth / firstRect.width;

    // Apply FLIP animation
    clone.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0) scale(${scaleFactor}) rotate(0deg)`;
    clone.addEventListener('click', () => this.closeLightbox());

    // Move focus into the dialog so keyboard/screen-reader users land
    // somewhere sensible instead of on the now-hidden original image.
    clone.focus();
  }

  closeLightbox() {
    if (!this.activeLightbox) return;
    const { original, clone, rot } = this.activeLightbox;

    this.backdrop.classList.remove('is-active');
    this.backdrop.setAttribute('aria-hidden', 'true');

    // Smoothly return to the exact stage item location and rotation
    clone.style.transform = `translate3d(0, 0, 0) scale(1) rotate(${rot}deg)`;

    let restored = false;
    const restore = () => {
      if (restored) return;
      restored = true;
      original.classList.remove('is-hidden');
      clone.remove();
      this.items.forEach(i => i.setAttribute('tabindex', '0'));
      this.stage.removeAttribute('aria-hidden');
      original.focus();
      this.activeLightbox = null;
    };

    clone.addEventListener('transitionend', restore, { once: true });
    // Fallback in case transitionend never fires (interrupted transition,
    // reduced-motion disabling the transition entirely, etc.) so the UI
    // never gets stuck with the background permanently trapped/hidden.
    setTimeout(restore, this.prefersReducedMotion ? 0 : 500);
  }

  startLoop() {
    if (!this.rafId) {
      this.rafId = requestAnimationFrame(() => this.animate());
    }
  }

  animate() {
    const friction = this.pointerType === 'touch' ? 0.94 : 0.88;
    const lerpRate = this.pointerType === 'touch' ? 0.14 : 0.1;

    if (!this.isDragging) {
      this.target.x = this.clamp(this.target.x + this.velocity.x, this.bounds.minX, 0);
      this.target.y = this.clamp(this.target.y + this.velocity.y, this.bounds.minY, 0);
      this.velocity.x *= friction;
      this.velocity.y *= friction;
    }

    // Parallax fades to zero the moment the user actually takes control
    // (dragging, pinching, or the lightbox open) so it never fights the
    // pan the user asked for.
    if (this.isDragging || this.activeLightbox) {
      this.parallaxTarget.x = 0;
      this.parallaxTarget.y = 0;
    }

    if (this.prefersReducedMotion) {
      this.position.x = this.target.x;
      this.position.y = this.target.y;
      this.scale = this.targetScale;
      this.parallax.x = 0;
      this.parallax.y = 0;
    } else {
      this.position.x += (this.target.x - this.position.x) * lerpRate;
      this.position.y += (this.target.y - this.position.y) * lerpRate;
      this.scale += (this.targetScale - this.scale) * lerpRate;
      this.parallax.x += (this.parallaxTarget.x - this.parallax.x) * lerpRate;
      this.parallax.y += (this.parallaxTarget.y - this.parallax.y) * lerpRate;
    }

    this.render();

    const isMoving =
      Math.hypot(this.velocity.x, this.velocity.y) > 0.02 ||
      Math.hypot(this.target.x - this.position.x, this.target.y - this.position.y) > 0.05 ||
      Math.abs(this.targetScale - this.scale) > 0.001 ||
      Math.hypot(this.parallaxTarget.x - this.parallax.x, this.parallaxTarget.y - this.parallax.y) > 0.05;

    if (this.isDragging || isMoving) {
      this.rafId = requestAnimationFrame(() => this.animate());
    } else {
      this.rafId = null;
    }
  }

  render() {
    const x = this.position.x + this.parallax.x;
    const y = this.position.y + this.parallax.y;
    this.canvas.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${this.scale})`;
  }
}
