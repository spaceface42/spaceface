<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spaceface Minimal Screensaver Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #111;
        color: #eee;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
      }

      p {
        color: #aaa;
        line-height: 1.6;
      }

      code {
        color: #b7ffcf;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Minimal screensaver demo</h1>
      <p>
        Wait for the idle timer, or press <code>Ctrl + Shift + .</code> to start
        the screensaver manually.
      </p>
    </main>

    <div data-feature="screensaver" data-screensaver hidden aria-hidden="true"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
